<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#000;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  h3,p{margin:0;}
  .wrap{padding:20px 16px;display:flex;flex-direction:column;gap:16px;}
  .h{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9aa0a6;}
  .panel{border:1px solid #1a1a1a;border-radius:16px;background:#000;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;}
  .spinner{width:34px;height:34px;border-radius:999px;border:3px solid #1a1a1a;border-top-color:#d4af37;}
  .muted{color:#9aa0a6;font-size:14px;}
  .errtext{color:#ff5a5f;font-weight:600;font-size:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:10px;border:1px solid #1a1a1a;background:#101010;color:#fff;font-weight:600;font-size:13px;}
  .ico{width:32px;height:32px;fill:none;stroke:#9aa0a6;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
</style>
</helmet>

<div class="wrap">
  <div class="h">Loading</div>
  <div class="panel">
    <div class="spinner"></div>
    <div class="muted">Loading events…</div>
  </div>

  <div class="h">Error</div>
  <div class="panel">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
    <div class="errtext">Couldn't load the home screen.</div>
    <span class="btn">Try again</span>
  </div>

  <div class="h">Empty</div>
  <div class="panel">
    <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/></svg>
    <div class="muted">No upcoming events.</div>
  </div>
</div>
</x-dc>
</body>
</html>

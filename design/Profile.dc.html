<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#000;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  h1,h2,p{margin:0;}
  .screen{min-height:100%;background:#000;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:2px solid #d4af37;background:#000;}
  .topbar h1{font-size:20px;font-weight:800;}
  .logout{font-size:14px;font-weight:700;color:#d4af37;}
  .content{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;}
  .card{border:1px solid #1a1a1a;border-radius:16px;background:#0a0a0a;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .idrow{display:flex;align-items:center;gap:14px;}
  .crest{width:60px;height:60px;border-radius:16px;object-fit:cover;border:1px solid #1a1a1a;flex-shrink:0;}
  .name{font-size:20px;font-weight:800;}
  .meta{color:#9aa0a6;font-size:13px;}
  .badges{display:flex;gap:8px;flex-wrap:wrap;}
  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.03em;background:#0c0c0c;border:1px solid #1a1a1a;color:#cfcfcf;}
  .badge.gold{background:#141000;border-color:#d4af37;color:#d4af37;}
  .badge.blue{background:#05141f;border-color:#5aa9e6;color:#5aa9e6;}
  .warn{color:#f0a63a;font-weight:600;font-size:14px;}
  .btn-danger{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:10px;border:1px solid #ff5a5f;background:#ff5a5f;color:#111;font-weight:700;font-size:15px;min-height:48px;width:100%;}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #141414;}
  .kv:last-of-type{border-bottom:0;}
  .kv .k{color:#9aa0a6;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
  .kv .v{font-size:15px;}
  .hint{color:#9aa0a6;font-size:13px;}
  .server{color:#9aa0a6;font-size:12px;text-align:center;opacity:0.7;}
  .tabbar{display:flex;border-top:1px solid #1a1a1a;background:#0a0a0a;padding:8px 4px 12px;}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#9aa0a6;}
  .tabbar a.active{color:#d4af37;}
  .tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
</style>
</helmet>

<div class="screen">
  <div class="topbar"><h1>Profile</h1><span class="logout">Log out</span></div>

  <div class="content">
    <div class="card">
      <div class="idrow">
        <img class="crest" src="crest.jpg" alt="">
        <div>
          <div class="name">Jesse Malone</div>
          <div class="meta">jesse.malone@gmail.com</div>
        </div>
      </div>
      <div class="badges">
        <span class="badge gold">DIRECTOR</span>
        <span class="badge blue">GOALIE / SKATER</span>
      </div>
      <p class="warn">Your email isn't verified — you can't RSVP yet.</p>
    </div>

    <button class="btn-danger">Sign out</button>

    <div class="card">
      <div class="kv"><span class="k">Phone</span><span class="v">(917) 555-0132</span></div>
      <div class="kv"><span class="k">Text alerts</span><span class="v">On</span></div>
      <p class="hint">Profile details are edited on the website for now.</p>
    </div>

    <div class="server">invites.falcon83.com</div>
  </div>

  <nav class="tabbar">
    <a><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</a>
    <a><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/></svg>Events</a>
    <a><svg viewBox="0 0 24 24"><path d="M20 14a2 2 0 0 1-2 2H9l-4 3V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2z"/></svg>Messages</a>
    <a class="active"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="8" r="4"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
</body>
</html>

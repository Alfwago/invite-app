<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#000;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  h1,p{margin:0;}
  .screen{min-height:100%;background:#000;display:flex;flex-direction:column;}
  .handle{display:flex;justify-content:center;padding:10px 0 4px;}
  .handle span{width:36px;height:5px;border-radius:999px;background:#2a2a2a;}
  .navbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 14px;border-bottom:2px solid #d4af37;}
  .navbar h1{font-size:18px;font-weight:800;}
  .navbar .cancel{color:#9aa0a6;font-size:15px;}
  .content{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;}
  .card{border:1px solid #1a1a1a;border-radius:16px;background:#0a0a0a;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .label{color:#9aa0a6;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
  .option{display:flex;align-items:center;gap:12px;border:1px solid #1a1a1a;border-radius:10px;padding:12px;font-size:15px;}
  .option.active{border-color:#d4af37;background:#000;}
  .radio{width:20px;height:20px;border-radius:999px;border:2px solid #1a1a1a;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .option.active .radio{border-color:#d4af37;}
  .radio i{width:10px;height:10px;border-radius:999px;background:#d4af37;display:block;}
  .input{width:100%;padding:12px;border-radius:10px;border:1px solid #1a1a1a;background:#000;color:#9aa0a6;font-size:16px;}
  .hint{color:#9aa0a6;font-size:13px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:10px;border:1px solid #d4af37;background:#d4af37;color:#111;font-weight:700;font-size:15px;min-height:48px;width:100%;}
  .nlogo{width:28px;height:28px;border-radius:8px;background:#fff;padding:2px;object-fit:contain;flex-shrink:0;}
</style>
</helmet>

<div class="screen">
  <div class="handle"><span></span></div>
  <div class="navbar"><span class="cancel">Cancel</span><h1>New event</h1><span style="width:48px;"></span></div>

  <div class="content">
    <div class="card">
      <span class="label">Which skate?</span>
      <div class="option active"><span class="radio"><i></i></span><img class="nlogo" src="night_monday.jpg" alt="">Monday Mules</div>
      <div class="option"><span class="radio"></span><img class="nlogo" src="night_wednesday.jpg" alt="">Wednesday Wrecking Crew</div>
      <div class="option"><span class="radio"></span><img class="nlogo" src="night_thursday.jpg" alt="">Thursday Old Fashioneds</div>
      <div class="option"><span class="radio"></span><img class="nlogo" src="night_sunday.jpg" alt="">Sunday Black Sabbath</div>
      <div class="option"><span class="radio"></span>Custom event (no skate group)</div>
    </div>

    <div class="card">
      <span class="label">Date (optional)</span>
      <div class="input">YYYY-MM-DD — blank = today</div>
      <p class="hint">Start time, roster limit and the invite list come from the skate group's defaults.</p>
    </div>

    <button class="btn">Create event</button>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#000;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{color:#d4af37;text-decoration:none;}
  h1,h2,h3,p{margin:0;}
  .screen{min-height:100%;background:#000;display:flex;flex-direction:column;}
  .navbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid #d4af37;background:#000;}
  .navbar svg{width:22px;height:22px;fill:none;stroke:#d4af37;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .navbar h1{font-size:18px;font-weight:800;}
  .content{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;}
  .card{border:1px solid #1a1a1a;border-radius:16px;background:#0a0a0a;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .card--director{border-left:4px solid #ff5a5f;}
  .card h2{font-size:16px;font-weight:700;}
  .dirtag{align-self:flex-start;padding:2px 8px;border-radius:999px;background:#1a0000;border:1px solid #ff5a5f;color:#ff5a5f;font-size:11px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;}
  .meta{color:#9aa0a6;font-size:13px;}
  .row{display:flex;align-items:center;gap:12px;}
  .nlogo{width:52px;height:52px;border-radius:12px;background:#fff;padding:4px;object-fit:contain;flex-shrink:0;}
  .badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#0c0c0c;border:1px solid #1a1a1a;color:#cfcfcf;}
  .badge.ok{background:#00140a;border-color:#33d17a;color:#33d17a;}
  .label{color:#9aa0a6;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
  .textarea{width:100%;min-height:78px;padding:12px;border-radius:10px;border:1px solid #1a1a1a;background:#000;color:#fff;font-size:15px;font-family:inherit;}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:10px;border:1px solid #1a1a1a;background:#101010;color:#fff;font-weight:600;font-size:15px;min-height:48px;width:100%;}
  .btn-gold{background:#d4af37;color:#111;border-color:#d4af37;font-weight:700;}
  .btn[disabled]{opacity:0.5;}
  .divider{height:1px;background:#1a1a1a;margin:2px 0;}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .tile{background:#101010;border:1px solid #1a1a1a;border-radius:12px;padding:12px 8px;text-align:center;}
  .tile b{display:block;font-size:22px;font-weight:800;}
  .tile small{display:block;margin-top:4px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#9aa0a6;}
</style>
</helmet>

<div class="screen">
  <div class="navbar">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    <h1>Wednesday Wrecking Crew</h1>
  </div>

  <div class="content">
    <div class="card">
      <div class="row">
        <img class="nlogo" src="night_wednesday.jpg" alt="">
        <div>
          <div style="font-size:20px;font-weight:800;">Wednesday Wrecking Crew</div>
          <div class="meta">Wed, Sep 10 · 9:15 PM · Rink 1</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span class="badge">OPEN</span>
        <span class="badge need">Short-handed</span>
        <span class="badge">You manage this event</span>
      </div>
    </div>

    <div class="card">
      <h2>Roster</h2>
      <div class="tiles">
        <div class="tile"><b style="color:#f0a63a;">12<span style="color:#9aa0a6;font-weight:600;font-size:15px;">/22</span></b><small>Skaters</small></div>
        <div class="tile"><b style="color:#ff5a5f;">1<span style="color:#9aa0a6;font-weight:600;font-size:15px;">/2</span></b><small>Goalies</small></div>
        <div class="tile"><b>0</b><small>Waitlist</small></div>
      </div>
    </div>

    <div class="card card--director">
      <span class="dirtag">Director only</span>
      <h2 style="color:#d4af37;">Director</h2>

      <div style="display:flex;flex-direction:column;gap:6px;">
        <span class="label">Director message</span>
        <textarea class="textarea">Bring a light and a dark. We're testing the new nets — get there early.</textarea>
      </div>
      <button class="btn" disabled>Message saved</button>

      <div class="divider"></div>

      <span class="meta">Invites sent Sep 3, 6:00 PM</span>
      <button class="btn btn-gold">Send invites</button>
      <button class="btn">Send batch 2</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
